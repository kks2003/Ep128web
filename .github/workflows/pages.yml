# Éles oldal: a main ág minden változása lefordul és kikerül a gh-pages ág
# gyökerébe (https://kks2003.github.io/Ep128web/). A PR-előnézetek mappáját
# (pr-preview/) érintetlenül hagyja.
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11
      - name: Build
        run: ./build.sh
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
